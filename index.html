<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <title>PulseChat</title>
    <meta name="description" content="PulseChat — minimal social network for sharing moments and chatting with friends." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PulseChat" />
    <meta name="twitter:title" content="PulseChat" />
    <meta property="og:description" content="Minimal social network for sharing moments and chatting with friends." />
    <meta name="twitter:description" content="Minimal social network for sharing moments and chatting with friends." />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Prevent FOUC: apply theme before React mounts
      (function () {
        try {
          var t = localStorage.getItem("pc.theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
